{% extends 'casos/base.html' %}

{% block contenido %}
<div class="card shadow-sm col-md-6 mx-auto border-danger">
    <div class="card-header bg-danger text-white">
        <h4 class="mb-0">Confirmar Eliminación</h4>
    </div>
    <div class="card-body">
        <p>¿Está seguro de que desea eliminar al cliente <strong>{{ cliente.nombres }}</strong> (Doc: {{ cliente.documento }})?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'lista_clientes' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
