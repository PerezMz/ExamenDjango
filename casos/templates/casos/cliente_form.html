{% extends 'casos/base.html' %}

{% block contenido %}
<div class="card shadow-sm col-md-6 mx-auto">
    <div class="card-header bg-primary text-white">
        <h4 class="mb-0">{% if cliente %}Editar Cliente{% else %}Nuevo Cliente{% endif %}</h4>
    </div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Nombres Completos:</label>
                <input type="text" name="nombres" class="form-control" value="{{ cliente.nombres|default:'' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Documento (DNI/RUC):</label>
                <input type="text" name="documento" class="form-control" value="{{ cliente.documento|default:'' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Teléfono:</label>
                <input type="text" name="telefono" class="form-control" value="{{ cliente.telefono|default:'' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Correo Electrónico:</label>
                <input type="email" name="correo" class="form-control" value="{{ cliente.correo|default:'' }}" required>
            </div>
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{% url 'lista_clientes' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
